# One NexCart store: web + MySQL + scheduler.   cp .env.docker.example .env  &&  docker compose up -d --build
name: ${COMPOSE_PROJECT_NAME:-nexcart}

x-app: &app
  image: ${NEXCART_IMAGE:-nexcart:latest}
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DB_HOST: db
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:80"

  # runs reminders, nightly backups and the heartbeat shown on the System page
  scheduler:
    <<: *app
    command: ["sh", "-c", "while true; do su www-data -s /bin/sh -c 'php artisan schedule:run --no-interaction' >/dev/null 2>&1; sleep 60; done"]

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexcart}
      MYSQL_USER: ${DB_USERNAME:-nexcart}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  storage:
  dbdata:
